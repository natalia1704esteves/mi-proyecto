{% extends 'usuarios/base.html' %}

{% block title %}Establecer Contraseña - SIGEP{% endblock %}

{% block content %}
    <form method="POST">
        {% csrf_token %}
        
        <!-- Campo Nueva Contraseña -->
        <div class="form-group">
            <label>Nueva Contraseña</label>
            <div class="input-wrapper">
                <!-- Icono izquierdo (Candado) -->
                <i class="fa-solid fa-lock icon-left"></i>
                
                <!-- Input de contraseña (con ID único y padding derecho para el ojo) -->
                <input type="password" name="password" id="id_password1" class="form-control" 
                       required placeholder="Crea tu contraseña" 
                       style="padding-right: 40px;"
                       pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?\&quot;:{}|<>])[A-Za-z\d!@#$%^&*(),.?\&quot;:{}|<>]{8,15}$"
                       title="Min. 8-15 caracteres, 1 mayúscula, 1 número y 1 símbolo.">
                
                <!-- BOTÓN DEL VISOR (Ojo) -->
                <!-- Llama a togglePassword('ID_DEL_INPUT', 'ID_DEL_ICONO') -->
                <button type="button" class="toggle-password-btn" 
                        onclick="togglePassword('id_password1', 'icon_eye1')" 
                        tabindex="-1">
                    <i class="fa-solid fa-eye" id="icon_eye1"></i>
                </button>
            </div>
            <p class="info-text">
                Min. 8-15 caracteres, 1 mayúscula, 1 número y 1 símbolo (@, #, $, !).
            </p>
        </div>

        <!-- Campo Confirmar Contraseña -->
        <div class="form-group">
            <label>Confirmar Contraseña</label>
            <div class="input-wrapper">
                <!-- Icono izquierdo (Candado) -->
                <i class="fa-solid fa-lock icon-left"></i>
                
                <!-- Input de confirmación -->
                <input type="password" name="password_confirm" id="id_password2" class="form-control" 
                       required placeholder="Repite tu contraseña" 
                       style="padding-right: 40px;">
                
                <!-- BOTÓN DEL VISOR (Ojo) -->
                <button type="button" class="toggle-password-btn" 
                        onclick="togglePassword('id_password2', 'icon_eye2')" 
                        tabindex="-1">
                    <i class="fa-solid fa-eye" id="icon_eye2"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-primary">
            Guardar Contraseña y Activar Cuenta
        </button>
    </form>
{% endblock %}
