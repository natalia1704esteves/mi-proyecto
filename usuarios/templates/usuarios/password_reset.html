{% extends 'usuarios/base.html' %}

{% block title %}Recuperar Contraseña - SIGEP{% endblock %}

{% block content %}
<p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
    Ingresa tu correo registrado y te enviaremos un enlace para restablecer tu contraseña.
</p>

<form method="POST">
    {% csrf_token %}
    <div class="form-group">
        <label>Correo Electrónico</label>
        <div class="input-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required autofocus>
        </div>
    </div>

    <button type="submit" class="btn-primary">Enviar Enlace</button>
</form>

<div class="auth-links">
    <p><a href="{% url 'login' %}">Volver al inicio de sesión</a></p>
</div>
{% endblock %}
