{% extends 'usuarios/base.html' %}

{% block title %}Contraseña Cambiada - SIGEP{% endblock %}

{% block content %}
<div style="text-align: center;">
    <i class="fa-regular fa-circle-check" style="font-size: 45px; color: var(--success); margin-bottom: 15px;"></i>
    <h3 style="margin-bottom: 10px;">¡Contraseña actualizada!</h3>
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 25px;">
        Tu contraseña ha sido restablecida. Ya puedes iniciar sesión con tu nueva clave.
    </p>
    <a href="{% url 'login' %}" class="btn-primary" style="display: inline-block; text-decoration: none;">Iniciar Sesión</a>
</div>
{% endblock %}
