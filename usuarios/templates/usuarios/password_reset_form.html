{% extends 'usuarios/base.html' %}

{% block title %}Nueva Contraseña - SIGEP{% endblock %}

{% block content %}
<p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
    Ingresa tu nueva contraseña a continuación.
</p>

<form method="POST">
    {% csrf_token %}
    
    <!-- Campo 1: Nueva Contraseña -->
    <div class="form-group">
        <label>Nueva Contraseña</label>
        <div class="input-wrapper">
            <i class="fa-solid fa-lock icon-left"></i>
            
            <!-- Input con ID necesario para JS -->
            <input type="password" name="new_password1" id="id_new_password1" class="form-control" 
                   required placeholder="Ingresa tu nueva contraseña">
            
            <!-- Botón del Ojo -->
            <button type="button" class="toggle-password-btn" 
                    onclick="togglePassword('id_new_password1', 'icon_eye_reset1')" 
                    tabindex="-1">
                <i class="fa-solid fa-eye" id="icon_eye_reset1"></i>
            </button>
        </div>
        <p class="info-text">
            Min. 8-15 caracteres, 1 mayúscula, 1 número y 1 símbolo (@, #, $, !).
        </p>
    </div>

    <!-- Campo 2: Confirmar Nueva Contraseña -->
    <div class="form-group">
        <label>Confirmar Contraseña</label>
        <div class="input-wrapper">
            <i class="fa-solid fa-lock icon-left"></i>
            
            <!-- Input con ID necesario para JS -->
            <input type="password" name="new_password2" id="id_new_password2" class="form-control" 
                   required placeholder="Repite la nueva contraseña">
            
            <!-- Botón del Ojo -->
            <button type="button" class="toggle-password-btn" 
                    onclick="togglePassword('id_new_password2', 'icon_eye_reset2')" 
                    tabindex="-1">
                <i class="fa-solid fa-eye" id="icon_eye_reset2"></i>
            </button>
        </div>
    </div>

    <button type="submit" class="btn-primary">Cambiar Contraseña</button>
</form>
{% endblock %}
