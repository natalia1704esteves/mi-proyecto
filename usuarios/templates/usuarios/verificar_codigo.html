{% extends 'usuarios/base_dashboard.html' %}
{% load static %}

{% block title %}Verificar Código - SIGEP{% endblock %}

{% block content %}
<p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
    Ingresa el código de 6 dígitos enviado a tu correo para activar tu cuenta.
</p>

<form method="POST">
    {% csrf_token %}
    <div class="form-group">
        <div class="input-wrapper">
            <i class="fa-solid fa-shield-halved"></i>
            <input type="text" name="codigo" class="form-control" placeholder="000000" maxlength="6" pattern="\d*" style="text-align: center; letter-spacing: 5px; font-weight: 600; font-size: 18px;" required autofocus>
        </div>
    </div>

    <button type="submit" class="btn-primary">Verificar Cuenta</button>
</form>
{% endblock %}
